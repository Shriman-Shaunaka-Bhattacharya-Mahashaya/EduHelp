name: Code quality and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  DISABLE_INTERNAL_CRON: 'true'
  MONGODB_URI: mongodb://127.0.0.1:27017/eduhelp_test
  NEXTAUTH_SECRET: ci-test-only-not-a-production-secret
  NEXTAUTH_URL: http://127.0.0.1:3100

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 14
  browsers:
    name: Production build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      # Must match @playwright/test in package-lock.json. Includes browsers and OS libraries.
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Verify browser launches
        timeout-minutes: 1
        env:
          # GitHub mounts /github/home with a different owner; Firefox rejects it as root.
          HOME: /root
        run: |
          node --input-type=module <<'NODE'
          import { chromium, firefox, webkit } from '@playwright/test';
          import { existsSync } from 'node:fs';
          for (const browser of [chromium, firefox, webkit]) {
            const executable = browser.executablePath();
            if (!existsSync(executable)) throw new Error(`Missing ${browser.name()} executable: ${executable}. Match the CI container image to the locked Playwright version.`);
            console.log(`${browser.name()}: ${executable}`);
            const instance = await browser.launch({ headless: true, timeout: 15000 });
            await instance.close();
            console.log(`${browser.name()}: launch passed`);
          }
          NODE
      - run: npm run build
        timeout-minutes: 8
      - run: npm run test:e2e
        timeout-minutes: 10
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
